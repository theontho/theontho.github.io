<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/site.css"><link rel="stylesheet" href="scripts/social/card.css">
<style>.sc-grid { grid-template-columns: repeat(3, 1fr); } h1 { font-size: 60px; }</style>
</head><body><main class="sc-card">
  <section class="sc-text">
    <div class="sc-chips"><span class="sc-chip">May 2026</span></div>
    <h1>One app, ~30 UI stacks, built by AI</h1>
    <p class="sc-sub">The same desktop app in SwiftUI, Flutter, Qt, GTK, egui, ImGui and more.</p>
    <div class="sc-stats">
      <div class="sc-stat sc-hi"><b>${mean}<small>/5</small></b><span>average visual rating</span></div>
      <div class="sc-stat"><b>${rated}</b><span>screenshots rated</span></div>
    </div>
  </section>
  <section class="sc-grid">${tiles}</section>
</main></body></html>
